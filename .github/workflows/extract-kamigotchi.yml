name: Extract Kamigotchi Data

on:
  schedule:
    # Runs at 0:00, 2:00, 4:00, 6:00, 8:00, 10:00, 12:00, 14:00..., every 2 hrs
    - cron: '0 0-22/2 * * *'
  
  # This button lets you run it manually
  workflow_dispatch:

jobs:
  extract-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      
      - name: Run the extraction script
        run: node extract-kamigotchi-github.js
        env:
          VERCEL_BLOB_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
        timeout-minutes: 8
      
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-logs-${{ github.run_number }}
          path: extraction.log
          retention-days: 7
