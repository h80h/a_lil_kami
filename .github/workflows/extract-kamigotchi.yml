name: Extract Kamigotchi Data

on:
  repository_dispatch:
    types: [ping_from_cronjob]  # This "type" must match the JSON body later
  workflow_dispatch:            # Allows you to also trigger it manually for testing

# Logic A: Prevents multiple runs from interfering with each other
concurrency:
  group: extract-kamigotchi
  cancel-in-progress: false

jobs:
  # ─── Job 1: Heavy extraction via Playwright ───────────────────────────────
  extract-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Logic B: Cache Playwright browsers to speed up 5-minute intervals
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium & dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (if cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the extraction script
        id: extraction
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          node extract-kamigotchi-gha.js
          echo "END_TIME=$(date +%s)" >> $GITHUB_ENV
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Final Performance Summary
        if: always()
        run: |
          DURATION=$(( END_TIME - START_TIME ))
          echo "=========================================="
          echo "📊 PERFORMANCE SUMMARY"
          echo "Extraction & Upload took: $DURATION seconds"
          echo "=========================================="

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-logs-${{ github.run_number }}
          path: extraction.log
          # Reduced to 1 day to prevent UI clutter at 5-min intervals
          retention-days: 1

  # ─── Job 2: Fast listings fetch via gRPC (runs in parallel) ───────────────
  fetch-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the listings fetch script
        run: npx tsx fetch-listings-gha.ts
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

  # ─── Job 3: Purge Cloudflare cache once BOTH jobs succeed ─────────────────
  purge-cache:
    runs-on: ubuntu-latest
    needs: [extract-and-upload, fetch-listings]

    steps:
      - name: Purge Cloudflare Cache
        id: purge
        run: |
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://data.kami.h80h.xyz/kamiBundle.json","https://data.kami.h80h.xyz/kamiListings.json"]}')

          echo "Cloudflare Response: $RESPONSE"

          if [[ $RESPONSE == *"\"success\":true"* ]]; then
            echo "✅ Cache purged successfully."
          else
            echo "❌ Cache purge FAILED."
            exit 1
          fi