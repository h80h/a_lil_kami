<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kamigotchi, a cute spirit, you can view them all here.">
  <meta name="keywords" content="kami, kamigotchi, asphodel, fully onchain game, idle-RPG">
  <meta name="author" content="h80h">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="a lil kami">
  <meta property="og:description" content="kamigotchi nft collection viewer">
  <meta property="og:url" content="https://kami.h80h.xyz">
  <meta property="og:image" content="https://kami.h80h.xyz/card.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="a lil kami">
  <title>a lil kami</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="preload" href="fonts/dogicapixel-0pwtcunc-webfont.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="a lil kami" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
</head>
<body>
  <img src="kami_loading.gif" alt="" class="loader">
  <div class="container" style="display: none;" none;>
    <!-- Search by ID -->
    <div class="search-section">
      <div id="search-section-container">
        <input type="text" id="searchInput" placeholder="Enter NFT ID..." autocomplete="off">
        <div id="searchBtn" title="search">
          <svg id="searchBtn_svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg>
        </div>
        <div id="clearSearchBtn" title="clean">
          <svg id="clearSearchBtn_svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28"><path d="M20.62,2C23.97,7.61 12.47,20.15 12.47,20.15L9.6,17.28L4.91,22L2.77,19.86L20.62,2Z" /></svg>
        </div>
        <div id="refreshDataBtn" data-tooltip="refresh data">
          <svg id="refreshDataBtn_svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30"><path d="M2 12C2 16.97 6.03 21 11 21C13.39 21 15.68 20.06 17.4 18.4L15.9 16.9C14.63 18.25 12.86 19 11 19C4.76 19 1.64 11.46 6.05 7.05C10.46 2.64 18 5.77 18 12H15L19 16H19.1L23 12H20C20 7.03 15.97 3 11 3C6.03 3 2 7.03 2 12Z" /></svg>
        </div>
      </div>
      <div class="online-indicator-container">
        <span id="pulse-dot"></span>
        <span class="online-text">
          <span id="online-count">0</span> OnLine
        </span>
      </div>
    </div>

    <!-- Selected IDs Display -->
    <div id="selectedIDs" class="selected-ids"></div>

    <!-- Filter by Traits -->
    <div class="trait-filter-section">
      <div id="filterControls"></div>
      
      <!-- Selected Traits Display -->
      <div id="selectedTraitsDisplay" class="selected-traits-display" style="display: none;"></div>
      <button id="clearBtn">CLEAR</button>
      <button id="affinityFilterToggle">Affinity</button>
      <button id="minmaxFilterToggle">min-MAX</button>
      <button id="listingFilterBtn">Listing</button>
    </div>

    <div class="sort-section">
      <div class="sort-label">Sort Order:</div>
      <div class="sort-buttons">
          <button class="sort-btn active" data-sort="latest">Latest!</button>
          <button class="sort-btn" data-sort="oldest">Oldest!</button>
          <button class="sort-btn" data-sort="rarity">Rarest!</button>
          <button class="sort-btn harmony" data-sort="harmony">Harmony</button>
          <button class="sort-btn health" data-sort="health">Health</button>
          <button class="sort-btn power" data-sort="power">Power</button>
          <button class="sort-btn violence" data-sort="violence">Violence</button>
          <button id="cloneFilterBtn">Clones</button>
      </div>
    </div>

    <div class="affinity-filter-section" style="display: none;">
      <div id="affinityFilterLabel">Affinity:</div>
      <div id="affinityFilterContainer">
        <div id="bodyAffinity">
          <div id="bodyAffinityLabel">Body:</div>
          <div class="affinity-filter-buttons">
              <button class="affinity-btn">EERIE</button>
              <button class="affinity-btn">SCRAP</button>
              <button class="affinity-btn">INSECT</button>
              <button class="affinity-btn">NORMAL</button>
          </div>
        </div>
        <div id="handAffinity">
          <div id="handAffinityLabel">Hand:</div>
          <div class="affinity-filter-buttons">
              <button class="affinity-btn">EERIE</button>
              <button class="affinity-btn">SCRAP</button>
              <button class="affinity-btn">INSECT</button>
              <button class="affinity-btn">NORMAL</button>
          </div>
        </div>
      </div>
    </div>

    <div class="minmax-filter-section" style="display: none;">
      <div id="minmaxFilterLabel">min-Max:</div>
      <div id="minmaxFilterContainer">
        <div class="stat-control health">
          <img class="stat-icon" src="https://app.kamigotchi.io/assets/health-ZqO6d5Ak.png" title="health">
          <input min="50" max="360" step="10" class="stat-control-input" type="range" value="50">
          <div class="display">
            <div class="display-item">
              <span class="stat-control-input-value">50</span>
            </div>
          </div>
          <div class="minmax-toggle">
            <input type="checkbox" id="health-toggle" class="toggle-input">
            <label for="health-toggle" class="toggle-label">
              <span class="label-min">min</span>
              <span class="label-max">MAX</span>
            </label>
          </div>
        </div>
        <div class="stat-control power">
          <img class="stat-icon" src="https://app.kamigotchi.io/assets/power-DgpSIKjO.png" title="power">
          <input min="10" max="44" step="1" class="stat-control-input" type="range" value="10">
          <div class="display">
            <div class="display-item">
              <span class="stat-control-input-value">10</span>
            </div>
          </div>
          <div class="minmax-toggle">
            <input type="checkbox" id="power-toggle" class="toggle-input">
            <label for="power-toggle" class="toggle-label">
              <span class="label-min">min</span>
              <span class="label-max">MAX</span>
            </label>
          </div>
        </div>
        <div class="stat-control violence">
            <img class="stat-icon" src="https://app.kamigotchi.io/assets/violence-2QoeI4RM.png" title="violence">
            <input min="10" max="42" step="1" class="stat-control-input" type="range" value="10">
            <div class="display">
            <div class="display-item">
              <span class="stat-control-input-value">10</span>
            </div>
            </div>
            <div class="minmax-toggle">
            <input type="checkbox" id="violence-toggle" class="toggle-input">
            <label for="violence-toggle" class="toggle-label">
              <span class="label-min">min</span>
              <span class="label-max">MAX</span>
            </label>
          </div>
        </div>
        <div class="stat-control harmony">
          <img class="stat-icon" src="https://app.kamigotchi.io/assets/harmony-BmwPIlDW.png" title="harmony">
          <input min="10" max="38" step="1" class="stat-control-input" type="range" value="10">
          <div class="display">
            <div class="display-item">
              <span class="stat-control-input-value">10</span>
            </div>
          </div>
          <div class="minmax-toggle">
            <input type="checkbox" id="harmony-toggle" class="toggle-input">
            <label for="harmony-toggle" class="toggle-label">
              <span class="label-min">min</span>
              <span class="label-max">MAX</span>
            </label>
          </div>
        </div>
        <div class="stat-control slots">
          <img class="stat-icon" src="https://app.kamigotchi.io/assets/slots-D5Uktt4Y.png" title="slots">
          <input min="0" max="3" step="1" class="stat-control-input" type="range" value="0">
          <div class="display">
            <div class="display-item">
              <span class="stat-control-input-value">0</span>
            </div>
          </div>
          <div class="minmax-toggle">
            <input type="checkbox" id="slots-toggle" class="toggle-input">
            <label for="slots-toggle" class="toggle-label">
              <span class="label-min">min</span>
              <span class="label-max">MAX</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Results Display -->
    <div id="results"></div>        
  </div>
  <div id="scrollToTop" class="scroll-to-top" title="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>arrow-up</title><path d="M13,20H11V8L5.5,13.5L4.08,12.08L12,4.16L19.92,12.08L18.5,13.5L13,8V20Z" /></svg>
  </div>
</body>
</html>
